# =============================================================================
#  Render.com Blueprint - Algerian School Support (Laravel 8 school_dashboard)
#  Deployment:  dockerContext -> ./school_dashboard, Dockerfile in that dir.
#  Essential Laravel vars (APP_ENV, APP_DEBUG, APP_KEY) are defined here.
#  Messenger secrets (MESSENGER_*) and AI_API_KEY are sync:false -> set them
#  in Render Dashboard / env group before deploy.
#  No persistent disk (free plan): SQLite lives inside the container and is
#  seeded + migrated on each start; data is ephemeral across redeploys.
# =============================================================================

services:
  - type: web
    name: algerian-school-dashboard
    runtime: docker
    plan: free
    dockerContext: ./school_dashboard
    dockerfilePath: ./school_dashboard/Dockerfile
    healthCheckPath: /api/health
    numInstances: 1
    envVars:
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        sync: false            # set in Render dashboard (your Render URL)
      - key: APP_KEY
        value: "base64:ByOv5Ie6i4ZsNmyWIUIAVgUYRJ1qvqlJwH1nkS5zJ1Q="   # Laravel 32-byte AES key
      - key: DB_CONNECTION
        value: sqlite
      - key: SESSION_DRIVER
        value: cookie
      - key: MESSENGER_VERIFY_TOKEN
        sync: false            # secret
      - key: MESSENGER_PAGE_ACCESS_TOKEN
        sync: false            # secret
      - key: MESSENGER_APP_SECRET
        sync: false            # secret
      - key: AI_API_KEY
        sync: false            # secret
# =============================================================================
#  Algerian School Support - Production Stack
#
#  Services:
#    - gateway    : FastAPI Meta Messenger webhook (verify + async reply)
#    - ai_engine  : CrewAI (Gemini) agent, exposes /v1/reply
#    - redis      : cache / lightweight queue
#    - dashboard  : Laravel school management dashboard (+ its DB)
#    - db         : PostgreSQL for the dashboard
#
#  Usage:
#    cp ai_engine/.env.example .env   # then fill values
#    docker compose up --build
# =============================================================================

name: algerian-school-ai

services:
  # ---------------------------------------------------------------------------
  # 1) FastAPI Messenger Gateway
  # ---------------------------------------------------------------------------
  gateway:
    build:
      context: ./meta_gateway
      dockerfile: Dockerfile
    container_name: meta_gateway
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Point the gateway at the AI engine docker service.
      AI_ENGINE_URL: http://ai_engine:8000
    ports:
      - "8001:8000"
    depends_on:
      ai_engine:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - app-net

  # ---------------------------------------------------------------------------
  # 2) CrewAI AI Engine (Gemini)
  # ---------------------------------------------------------------------------
  ai_engine:
    build:
      context: ./ai_engine
      dockerfile: Dockerfile
    container_name: ai_engine
    restart: unless-stopped
    env_file:
      - .env
    environment:
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.6-flash}
      SERVER_MODE: ${SERVER_MODE:-dev}
    ports:
      - "8002:8000"
    networks:
      - app-net

  # ---------------------------------------------------------------------------
  # 3) Redis (cache / queue)
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - app-net

  # ---------------------------------------------------------------------------
  # 4) Laravel School Dashboard
  # ---------------------------------------------------------------------------
  dashboard:
    build:
      context: ./school_dashboard
      dockerfile: Dockerfile
    container_name: school_dashboard
    restart: unless-stopped
    environment:
      - APACHE_DOCUMENT_ROOT=/var/www/html/public
      - DB_CONNECTION=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_DATABASE=school
      - DB_USERNAME=school
      - DB_PASSWORD=${DB_PASSWORD:-change_me}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:80"
    networks:
      - app-net

  # ---------------------------------------------------------------------------
  # 5) MySQL (dashboard database - Laravel/lav_sms)
  # ---------------------------------------------------------------------------
  db:
    image: mysql:8.0
    container_name: school_db
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    environment:
      MYSQL_DATABASE: school
      MYSQL_USER: school
      MYSQL_PASSWORD: ${DB_PASSWORD:-change_me}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-change_me}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-net

volumes:
  redis-data:
  db-data:

networks:
  app-net:
    driver: bridge

# Nixpacks configuration for Railway
# https://nixpacks.com/docs/providers/php
#
# Railway builds this project with buildDir="school_dashboard",
# so the build context root IS this directory and maps to /app at build time.
# Composer is installed via its installer script (not nixPkgs), then invoked
# through `php composer.phar` to guarantee it exists on PATH-independent path.

[phases.setup]
nixPkgs = ["php82", "php82Extensions.pdo", "php82Extensions.pdo_sqlite", "php82Extensions.sqlite3", "php82Extensions.mbstring", "php82Extensions.xml", "php82Extensions.curl", "php82Extensions.zip", "php82Extensions.bcmath", "php82Extensions.gd", "php82Extensions.fileinfo"]

[phases.install]
workdir = "/app"
cmds = [
  "curl -sS https://getcomposer.org/installer | php",
  "php /app/composer.phar install --no-dev --optimize-autoloader --no-interaction"
]

[phases.build]
workdir = "/app"
cmds = [
  "php /app/composer.phar dump-autoload --no-dev --optimize",
  "php artisan config:cache",
  "php artisan route:cache",
  "php artisan view:cache"
]

[start]
workdir = "/app"
cmd = "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT"
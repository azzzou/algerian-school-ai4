# Nixpacks configuration for Railway
# Laravel project is in school_dashboard/ subdirectory

[phases.setup]
nixPkgs = ["php82", "php82Extensions.pdo", "php82Extensions.pdo_sqlite", "php82Extensions.sqlite3", "php82Extensions.mbstring", "php82Extensions.xml", "php82Extensions.curl", "php82Extensions.zip", "php82Extensions.bcmath", "php82Extensions.gd", "php82Extensions.fileinfo"]
env = { COMPOSER_ALLOW_SUPERUSER = "1" }

[phases.install]
workdir = "/app/school_dashboard"
cmds = [
  "curl -sS https://getcomposer.org/installer | php",
  "cd /app/school_dashboard && php composer.phar install --no-dev --optimize-autoloader --no-interaction"
]

[phases.build]
workdir = "/app/school_dashboard"
cmds = [
  "cd /app/school_dashboard && php artisan config:cache",
  "cd /app/school_dashboard && php artisan route:cache",
  "cd /app/school_dashboard && php artisan view:cache"
]

[start]
workdir = "/app/school_dashboard"
cmd = "cd /app/school_dashboard && php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT"
